name: Build KerigmaOS ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios do repositório
        run: |
          for f in "apps/kerigma-welcome/kerigma-welcome.py" "apps/kerigma-welcome/kerigma-welcome.desktop" "apps/kerigma-settings/kerigma-settings.py"; do
            if [ ! -f "$f" ]; then
              echo "ERRO: Arquivo obrigatorio ausente no repositorio: $f"
              exit 1
            fi
          done

      - name: Liberar espaço em disco e instalar ferramentas
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Check-Date=false update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin \
            grub-efi-amd64-bin mtools live-build

      - name: Criar script de Build do KerigmaOS v1.1
        run: |
          cat << 'EOF' > build.sh
          #!/usr/bin/env bash
          set -e
          WORK_DIR="/opt/kerigmaos-build"
          ROOTFS="$WORK_DIR/rootfs"
          ISO_DIR="$WORK_DIR/iso"
          ISO_NAME="KerigmaOS-1.0-Full-amd64.iso"

          sudo mkdir -p "$ROOTFS" "$ISO_DIR/live" "$ISO_DIR/boot/grub"

          echo "=== 1. Debootstrap (Debian Bookworm) ==="
          sudo debootstrap --variant=minbase --arch=amd64 bookworm "$ROOTFS" http://deb.debian.org/debian/

          echo "=== 2. Criando Identidade Visual, Apps e Ferramentas OTA ==="
          sudo mkdir -p "$ROOTFS/usr/local/bin" \
                        "$ROOTFS/usr/share/applications" \
                        "$ROOTFS/usr/share/pixmaps" \
                        "$ROOTFS/usr/share/wallpapers" \
                        "$ROOTFS/etc/skel/.config/autostart" \
                        "$ROOTFS/etc/skel/.config/plank/dock1/launchers" \
                        "$ROOTFS/etc/skel/.config/gtk-3.0" \
                        "$ROOTFS/etc/skel/Desktop" \
                        "$ROOTFS/etc/calamares/branding/kerigmaos"

          # Símbolo Oficial
          cat << 'LOGOSVG' | sudo tee "$ROOTFS/usr/share/pixmaps/kerigma-logo.svg" > /dev/null
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <defs>
              <linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#007aff"/>
                <stop offset="100%" stop-color="#5856d6"/>
              </linearGradient>
            </defs>
            <rect width="112" height="112" x="8" y="8" rx="28" fill="url(#kg)"/>
            <path d="M42 32 v64 M42 64 L82 32 M56 52 L86 96" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
          LOGOSVG

          # Ícone Launchpad
          cat << 'LAUNCHSVG' | sudo tee "$ROOTFS/usr/share/pixmaps/kerigma-launchpad.svg" > /dev/null
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e1e2e"/><stop offset="100%" stop-color="#2d2d44"/></linearGradient></defs>
            <rect width="112" height="112" x="8" y="8" rx="26" fill="url(#lg)" stroke="#4a4a6a" stroke-width="3"/>
            <rect x="28" y="28" width="20" height="20" rx="5" fill="#ff3b30"/><rect x="54" y="28" width="20" height="20" rx="5" fill="#4cd964"/><rect x="80" y="28" width="20" height="20" rx="5" fill="#007aff"/>
            <rect x="28" y="54" width="20" height="20" rx="5" fill="#ff9500"/><rect x="54" y="54" width="20" height="20" rx="5" fill="#5856d6"/><rect x="80" y="54" width="20" height="20" rx="5" fill="#5ac8fa"/>
            <rect x="28" y="80" width="20" height="20" rx="5" fill="#ffcc00"/><rect x="54" y="80" width="20" height="20" rx="5" fill="#ff2d55"/><rect x="80" y="80" width="20" height="20" rx="5" fill="#34c759"/>
          </svg>
          LAUNCHSVG

          # Papel de Parede
          cat << 'WALLSVG' | sudo tee "$ROOTFS/usr/share/wallpapers/kerigma-wallpaper.svg" > /dev/null
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
            <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0d0d1a"/><stop offset="50%" stop-color="#1a1a3a"/><stop offset="100%" stop-color="#004080"/></linearGradient></defs>
            <rect width="1920" height="1080" fill="url(#bg)"/>
            <circle cx="960" cy="540" r="420" fill="#007aff" opacity="0.12"/>
            <circle cx="1350" cy="320" r="280" fill="#5856d6" opacity="0.15"/>
          </svg>
          WALLSVG

          # Apps Kerigma Welcome e Settings
          sudo cp apps/kerigma-welcome/kerigma-welcome.py "$ROOTFS/usr/local/bin/kerigma-welcome"
          sudo chmod +x "$ROOTFS/usr/local/bin/kerigma-welcome"
          sudo cp apps/kerigma-welcome/kerigma-welcome.desktop "$ROOTFS/usr/share/applications/"
          sudo cp apps/kerigma-welcome/kerigma-welcome.desktop "$ROOTFS/etc/skel/.config/autostart/"

          sudo cp apps/kerigma-settings/kerigma-settings.py "$ROOTFS/usr/local/bin/kerigma-settings"
          sudo chmod +x "$ROOTFS/usr/local/bin/kerigma-settings"
          
          cat << 'SETDESKTOP' | sudo tee "$ROOTFS/usr/share/applications/kerigma-settings.desktop" > /dev/null
          [Desktop Entry]
          Type=Application
          Name=Ajustes do Sistema
          Exec=/usr/local/bin/kerigma-settings
          Icon=/usr/share/pixmaps/kerigma-logo.svg
          Terminal=false
          Categories=System;Settings;
          SETDESKTOP

          # Instalador Calamares (Atalho Único)
          cat << 'INSTDESKTOP' | sudo tee "$ROOTFS/usr/share/applications/kerigma-installer.desktop" > /dev/null
          [Desktop Entry]
          Type=Application
          Name=Instalar o KerigmaOS
          Exec=sudo calamares
          Icon=/usr/share/pixmaps/kerigma-logo.svg
          Terminal=false
          Categories=System;
          INSTDESKTOP

          sudo cp "$ROOTFS/usr/share/applications/kerigma-installer.desktop" "$ROOTFS/etc/skel/Desktop/"

          # Calamares - Tema KerigmaOS Unificado
          cat << 'BRANDING' | sudo tee "$ROOTFS/etc/calamares/branding/kerigmaos/branding.desc" > /dev/null
          componentName: kerigmaos
          welcomeStyleBanner: true
          welcomeExpandingLogo: true
          windowExpands: true
          showSupportUrl: false
          showKnownIssuesUrl: false
          showReleaseNotesUrl: false
          showImagedSlideShow: true

          brandingCurve:
            ProductFullName: "KerigmaOS 1.0"
            ProductName: "KerigmaOS"
            ShortProductName: "KerigmaOS"
            Version: "1.0 Dev Edition"
            ShortVersion: "1.0"
            VersionedName: "KerigmaOS 1.0"
            ShortVersionedName: "KerigmaOS 1.0"
            BootloaderEntryName: "KerigmaOS"
            SlideshowAPI: 2

          style:
            SidebarBackground: "#1e1e2e"
            SidebarText: "#c8c8d8"
            SidebarTextCurrent: "#ffffff"
            SidebarBackgroundCurrent: "#007aff"

          images:
            productLogo: "/usr/share/pixmaps/kerigma-logo.svg"
            productIcon: "/usr/share/pixmaps/kerigma-logo.svg"
            productLogoDark: "/usr/share/pixmaps/kerigma-logo.svg"
            windowIcon: "/usr/share/pixmaps/kerigma-logo.svg"
            bannerLogo: "/usr/share/pixmaps/kerigma-logo.svg"
          BRANDING

          # Ferramentas OTA e Launchpad
          cat << 'UPDATESCRIPT' | sudo tee "$ROOTFS/usr/local/bin/kerigma-update" > /dev/null
          #!/usr/bin/env bash
          echo "Buscando atualizações oficiais no repositório do KerigmaOS..."
          curl -fsSL https://raw.githubusercontent.com/rafaelgrulke-sketch/KerigmaOS/main/update.sh | sudo bash
          UPDATESCRIPT
          sudo chmod +x "$ROOTFS/usr/local/bin/kerigma-update"

          cat << 'UPDATEDESK' | sudo tee "$ROOTFS/usr/share/applications/kerigma-update.desktop" > /dev/null
          [Desktop Entry]
          Type=Application
          Name=Atualizar KerigmaOS
          Exec=konsole -e /usr/local/bin/kerigma-update
          Icon=/usr/share/pixmaps/kerigma-logo.svg
          Terminal=false
          Categories=System;
          UPDATEDESK

          # Widget de Título de Janela (Plasmoid)
          PLASMOID_DIR="$ROOTFS/usr/share/plasma/plasmoids/org.kerigma.windowtitle"
          sudo mkdir -p "$PLASMOID_DIR/contents/ui"
          
          cat << 'METAEOF' | sudo tee "$PLASMOID_DIR/metadata.desktop" > /dev/null
          [Desktop Entry]
          Name=Kerigma Active App Title
          Type=Service
          X-KDE-ServiceTypes=Plasma/Applet
          X-Plasma-API=declarativeappletscript
          X-Plasma-MainScript=ui/main.qml
          X-KDE-PluginInfo-Name=org.kerigma.windowtitle
          X-KDE-PluginInfo-Version=1.0
          METAEOF

          cat << 'QMLEOF' | sudo tee "$PLASMOID_DIR/contents/ui/main.qml" > /dev/null
          import QtQuick 2.0
          import QtQuick.Layouts 1.1
          import org.kde.plasma.plasmoid 2.0
          import org.kde.plasma.core 2.0 as PlasmaCore
          import org.kde.plasma.components 2.0 as PlasmaComponents
          import org.kde.taskmanager 0.1 as TaskManager

          Item {
              id: root
              Layout.preferredWidth: titleLabel.implicitWidth + 18
              Layout.minimumWidth: titleLabel.implicitWidth + 18
              Layout.fillHeight: true
              Plasmoid.preferredRepresentation: Plasmoid.fullRepresentation
              TaskManager.ActivityInfo { id: activityInfo }
              TaskManager.VirtualDesktopInfo { id: virtualDesktopInfo }
              TaskManager.TasksModel {
                  id: tasksModel
                  sortMode: TaskManager.TasksModel.SortVirtualDesktop
                  groupMode: TaskManager.TasksModel.GroupDisabled
                  activity: activityInfo.currentActivity
                  virtualDesktop: virtualDesktopInfo.currentDesktop
                  filterByActivity: true
                  filterByVirtualDesktop: true
              }
              function activeAppTitle() {
                  for (var i = 0; i < tasksModel.count; i++) {
                      var idx = tasksModel.index(i, 0);
                      if (tasksModel.data(idx, TaskManager.AbstractTasksModel.IsActive)) {
                          var app = tasksModel.data(idx, TaskManager.AbstractTasksModel.AppName);
                          if (app && app.length > 0) return app;
                      }
                  }
                  return "Finder";
              }
              PlasmaComponents.Label {
                  id: titleLabel
                  anchors.centerIn: parent
                  text: activeAppTitle()
                  font.bold: true
                  font.pixelSize: 13
              }
              Connections {
                  target: tasksModel
                  function onActiveTaskChanged() { titleLabel.text = activeAppTitle(); }
                  function onDataChanged() { titleLabel.text = activeAppTitle(); }
                  function onCountChanged() { titleLabel.text = activeAppTitle(); }
              }
          }
          QMLEOF

          # Ícones e Dock padrão (Plank)
          for app in "kerigma-update" "kerigma-settings" "org.kde.dolphin" "org.kde.discover" "org.kde.konsole" "firefox-esr" "kerigma-installer"; do
            cat << DOCKITEM | sudo tee "$ROOTFS/etc/skel/.config/plank/dock1/launchers/${app}.dockitem" > /dev/null
          [PlankDockItemPreferences]
          Launcher=file:///usr/share/applications/${app}.desktop
          DOCKITEM
          done

          cat << 'KWINRC' | sudo tee "$ROOTFS/etc/skel/.config/kwinrc" > /dev/null
          [org.kde.kdecoration2]
          ButtonsOnLeft=XIA
          ButtonsOnRight=
          BorderSize=None

          [ModifierOnlyShortcuts]
          Meta=org.kde.plasmashell,/PlasmaShell,org.kde.PlasmaShell,activateLauncherMenu
          KWINRC

          cat << 'KDEGLOBALS' | sudo tee "$ROOTFS/etc/skel/.config/kdeglobals" > /dev/null
          [General]
          ColorScheme=BreezeDark
          Name=KerigmaOS Dark
          widgetStyle=Breeze
          [Icons]
          Theme=breeze-dark
          [KDE]
          LookAndFeelPackage=org.kde.breezedark.desktop
          SingleClick=false
          KDEGLOBALS

          cat << 'GTKINI' | sudo tee "$ROOTFS/etc/skel/.config/gtk-3.0/settings.ini" > /dev/null
          [Settings]
          gtk-application-prefer-dark-theme=1
          gtk-shell-shows-app-menu=1
          gtk-shell-shows-menubar=1
          GTKINI

          cat << 'GTKENV' | sudo tee "$ROOTFS/etc/profile.d/kerigma-appmenu.sh" > /dev/null
          export GTK_MODULES="appmenu-gtk-module"
          export UBUNTU_MENUPROXY=1
          GTKENV

          echo "=== 3. Montando sistemas virtuais ==="
          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /dev/pts "$ROOTFS/dev/pts"
          sudo mount -t proc /proc "$ROOTFS/proc"
          sudo mount -t sysfs /sys "$ROOTFS/sys"

          echo "=== 4. Configuração Chroot Completa ==="
          cat << 'INNER_EOF' | sudo tee "$ROOTFS/tmp/setup.sh" > /dev/null
          #!/bin/bash
          set -e
          export DEBIAN_FRONTEND=noninteractive
          export HOME=/root
          export LC_ALL=C

          echo "kerigma-os" > /etc/hostname
          echo "127.0.0.1 localhost kerigma-os" > /etc/hosts

          cat << 'SOURCES' > /etc/apt/sources.list
          deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
          SOURCES

          apt-get -o Acquire::Check-Valid-Until=false -o Acquire::Check-Date=false update

          apt-get install -y --no-install-recommends locales
          sed -i 's/# pt_BR.UTF-8 UTF-8/pt_BR.UTF-8 UTF-8/' /etc/locale.gen
          locale-gen
          echo 'LANG=pt_BR.UTF-8' > /etc/default/locale

          apt-get install -y --no-install-recommends \
              ca-certificates curl gnupg wget sudo ufw nano \
              linux-image-amd64 live-boot live-boot-initramfs-tools systemd-sysv \
              grub-efi-amd64 grub-pc-bin grub-common xorriso squashfs-tools mtools \
              xorg xserver-xorg-video-all xserver-xorg-input-all mesa-utils libgl1-mesa-dri \
              plymouth plymouth-themes sddm \
              plasma-desktop plasma-workspace systemsettings kwin-x11 \
              breeze-gtk-theme kde-config-gtk-style polkit-kde-agent-1 powerdevil upower \
              xdg-user-dirs xdg-utils dconf-cli \
              appmenu-gtk2-module appmenu-gtk3-module \
              libdbusmenu-glib4 libdbusmenu-gtk3-4 libdbusmenu-qt5-2 \
              pipewire pipewire-pulse pipewire-alsa wireplumber alsa-utils pavucontrol \
              network-manager plasma-nm plasma-pa bluez bluedevil usbutils pciutils \
              firmware-linux firmware-realtek firmware-iwlwifi firmware-atheros firmware-brcm80211 firmware-misc-nonfree \
              udisks2 ntfs-3g exfatprogs dosfstools ark unzip zip p7zip-full partitionmanager \
              dolphin konsole kde-spectacle kate kcalc okular gwenview vlc ffmpeg \
              plasma-systemmonitor plasma-discover plasma-discover-backend-flatpak flatpak \
              cups print-manager system-config-printer ipp-usb \
              fonts-noto-core fonts-noto-color-emoji fonts-firacode fonts-liberation \
              plank calamares calamares-settings-debian \
              firefox-esr firefox-esr-l10n-pt-br kiwix-tools \
              git zsh docker.io build-essential nodejs npm \
              python3-pyqt5 libqt5svg5 qdbus-qt5 htop neofetch \
              spice-vdagent qemu-guest-agent

          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo || true

          # Aplicar branding KerigmaOS no Calamares e remover atalhos Debian
          if [ -d /etc/calamares ]; then
              sed -i 's|/etc/calamares/branding/debian|/etc/calamares/branding/kerigmaos|g' /etc/calamares/settings.conf || true
              rm -f /usr/share/applications/install-debian.desktop /usr/share/applications/calamares.desktop || true
              rm -f /etc/xdg/autostart/calamares-desktop-icon.desktop || true
          fi

          mkdir -p /usr/share/wallpapers/Next/contents/images
          cp /usr/share/wallpapers/kerigma-wallpaper.svg /usr/share/wallpapers/Next/contents/images/1920x1080.svg
          cp /usr/share/wallpapers/kerigma-wallpaper.svg /usr/share/wallpapers/Next/contents/images/1024x768.svg

          # Configurar layout do painel superior do macOS nativamente
          cat << 'APPLYBAR' > /usr/local/bin/kerigma-apply-topbar
          #!/usr/bin/env bash
          kwriteconfig5 --file kded5rc --group Module-appmenu --key autoload true
          kwriteconfig5 --file kwinrc --group org.kde.kdecoration2 --key ButtonsOnLeft "XIA"
          kwriteconfig5 --file kwinrc --group org.kde.kdecoration2 --key ButtonsOnRight ""
          qdbus-qt5 org.kde.kded5 /kded org.kde.kded5.loadModule appmenu 2>/dev/null || true
          qdbus-qt5 org.kde.KWin /KWin reconfigure 2>/dev/null || true
          JS_SCRIPT='
          var allPanels = panels();
          for (var i = 0; i < allPanels.length; i++) { allPanels[i].remove(); }
          var topBar = new Panel("org.kde.panel");
          topBar.location = "top";
          topBar.height = 28;
          var logoMenu = topBar.addWidget("org.kde.plasma.kickoff");
          logoMenu.currentConfigGroup = ["General"];
          logoMenu.writeConfig("icon", "/usr/share/pixmaps/kerigma-logo.svg");
          topBar.addWidget("org.kerigma.windowtitle");
          topBar.addWidget("org.kde.plasma.appmenu");
          topBar.addWidget("org.kde.plasma.panelspacer");
          topBar.addWidget("org.kde.plasma.systemtray");
          var clock = topBar.addWidget("org.kde.plasma.digitalclock");
          clock.currentConfigGroup = ["Appearance"];
          clock.writeConfig("showDate", true);
          '
          qdbus-qt5 org.kde.plasmashell /PlasmaShell org.kde.PlasmaShell.evaluateScript "\$JS_SCRIPT" 2>/dev/null || true
          dconf write /net/launchpad/plank/docks/dock1/zoom-enabled true 2>/dev/null || true
          dconf write /net/launchpad/plank/docks/dock1/icon-size 48 2>/dev/null || true
          pkill plank 2>/dev/null || true
          nohup plank >/dev/null 2>&1 &
          APPLYBAR
          chmod +x /usr/local/bin/kerigma-apply-topbar

          cat << 'AUTOSTARTBAR' > /etc/skel/.config/autostart/kerigma-layout.desktop
          [Desktop Entry]
          Type=Application
          Name=Kerigma Layout
          Exec=/usr/local/bin/kerigma-apply-topbar
          Terminal=false
          AUTOSTARTBAR

          cat << 'OSRELEASE' > /etc/os-release
          PRETTY_NAME="KerigmaOS 1.0 Dev Edition"
          NAME="KerigmaOS"
          VERSION_ID="1.0"
          VERSION="1.0 (Dev Edition)"
          ID=kerigmaos
          ID_LIKE=debian
          HOME_URL="https://github.com/rafaelgrulke-sketch/KerigmaOS"
          OSRELEASE

          ufw default deny incoming || true
          ufw default allow outgoing || true
          sed -i 's/ENABLED=no/ENABLED=yes/' /etc/ufw/ufw.conf
          systemctl enable ufw bluetooth NetworkManager cups

          curl -fsSL https://ollama.com/install.sh | sh || true

          cat << 'ZSHRC' > /etc/skel/.zshrc
          PROMPT='%F{cyan}%n@kerigma-os%f:%F{blue}%~%f$ '
          alias ll='ls -la --color=auto'
          ZSHRC

          useradd -m -s /usr/bin/zsh kerigma
          echo "kerigma:live" | chpasswd
          usermod -aG sudo,video,audio,docker,netdev,bluetooth,lpadmin,plugdev kerigma
          echo "kerigma ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/kerigma
          chmod 0440 /etc/sudoers.d/kerigma
          chown -R kerigma:kerigma /home/kerigma

          mkdir -p /etc/sddm.conf.d
          echo -e "[Autologin]\nUser=kerigma\nSession=plasma" > /etc/sddm.conf.d/autologin.conf

          apt-get clean
          rm -rf /var/lib/apt/lists/*
          INNER_EOF

          sudo chmod +x "$ROOTFS/tmp/setup.sh"
          sudo chroot "$ROOTFS" /tmp/setup.sh
          sudo rm "$ROOTFS/tmp/setup.sh"

          echo "=== 5. Desmontando binds ==="
          sudo umount -lf "$ROOTFS/dev/pts" || true
          sudo umount -lf "$ROOTFS/dev" || true
          sudo umount -lf "$ROOTFS/proc" || true
          sudo umount -lf "$ROOTFS/sys" || true

          echo "=== 6. Compactando sistema em SquashFS ==="
          sudo cp "$ROOTFS/boot/vmlinuz-"* "$ISO_DIR/live/vmlinuz"
          sudo cp "$ROOTFS/boot/initrd.img-"* "$ISO_DIR/live/initrd"
          sudo mksquashfs "$ROOTFS" "$ISO_DIR/live/filesystem.squashfs" -comp xz -e boot
          sudo rm -rf "$ROOTFS"

          echo "=== 7. Configurando GRUB unificado ==="
          sudo mkdir -p "$ISO_DIR/boot/grub"
          cat << 'GRUB_EOF' | sudo tee "$ISO_DIR/boot/grub/grub.cfg" > /dev/null
          insmod part_gpt
          insmod part_msdos
          insmod fat
          insmod ext2
          set default="0"
          set timeout=5
          set menu_color_normal=white/black
          set menu_color_highlight=white/blue

          menuentry "KerigmaOS 1.0 — Instalar ou Experimentar" {
              linux /live/vmlinuz boot=live quiet splash calamares locales=pt_BR.UTF-8 keyboard-layouts=br ---
              initrd /live/initrd
          }
          GRUB_EOF

          sudo grub-mkrescue -o "$ISO_NAME" "$ISO_DIR"
          EOF
          chmod +x build.sh

      - name: Executar o build da ISO
        run: ./build.sh

      - name: Upload da ISO do KerigmaOS Completo
        uses: actions/upload-artifact@v4
        with:
          name: KerigmaOS-Full-ISO
          path: KerigmaOS-1.0-Full-amd64.iso
          retention-days: 5
