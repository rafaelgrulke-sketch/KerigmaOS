name: Build Kerigma OS Complete ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar Espaço em Disco no Runner do GitHub
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout do Repositório Kerigma OS
        uses: actions/checkout@v4

      - name: Instalar Dependências de Construção no Anfitrião (LFS Cap. 2.2)
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-efi-amd64 grub-efi-amd64-bin grub-efi-amd64-signed grub-pc-bin grub2-common shim-signed os-prober efibootmgr mtools dosfstools

      - name: Dar Permissão e Executar Build na pasta scripts/
        run: |
          chmod +x scripts/configure-calamares.sh
          chmod +x scripts/build-kerigma-iso.sh
          sudo ./scripts/build-kerigma-iso.sh

      - name: Upload da ISO Pronta como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KerigmaOS-Complete-amd64-ISO
          path: KerigmaOS-Complete-amd64.iso
          retention-days: 7
